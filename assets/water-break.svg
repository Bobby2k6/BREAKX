<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="waterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e88e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#26c6da;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4dd0e1;stop-opacity:1" />
    </linearGradient>
    <filter id="waterGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bubbleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#waterBg)" rx="20"/>

  <!-- Water glass -->
  <g transform="translate(100, 130)">
    <!-- Glass body -->
    <path d="M-35,40 L-45,-20 Q0,-50 45,-20 L35,40 Z" fill="url(#waterFill)" opacity="0.7" filter="url(#waterGlow)" stroke="#81d4fa" stroke-width="1.5"/>

    <!-- Water level animation -->
    <path d="M-33,40 L-33,5 Q0,-15 33,5 L33,40 Z" fill="url(#waterFill)" opacity="0.9" filter="url(#waterGlow)">
      <animate attributeName="d"
               values="M-33,40 L-33,5 Q0,-15 33,5 L33,40 Z;
                       M-33,40 L-33,-5 Q0,-25 33,-5 L33,40 Z;
                       M-33,40 L-33,5 Q0,-15 33,5 L33,40 Z"
               dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </path>

    <!-- Rim -->
    <ellipse cx="0" cy="-20" rx="45" ry="5" fill="none" stroke="#81d4fa" stroke-width="2" opacity="0.8"/>
    <ellipse cx="0" cy="-20" rx="40" ry="4" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.6"/>

    <!-- Bubbles rising -->
    <g filter="url(#bubbleBlur)">
      <circle cx="-20" cy="10" r="3" fill="#fff" opacity="0.6">
        <animate attributeName="cy" values="10;-25;10" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="20" r="2" fill="#fff" opacity="0.5">
        <animate attributeName="cy" values="20;-15;20" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="5" cy="15" r="2.5" fill="#fff" opacity="0.4">
        <animate attributeName="cy" values="15;-20;15" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-10" cy="25" r="1.5" fill="#fff" opacity="0.5">
        <animate attributeName="cy" values="25;-10;25" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Droplet animation at top -->
  <g transform="translate(100, 40)">
    <path d="M0,-10 Q8,-10 8,0 Q8,10 0,18 Q-8,10 -8,0 Q-8,-10 0,-10" fill="#4fc3f7" opacity="0.9" filter="url(#waterGlow)">
      <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-10 Q8,-10 8,0 Q8,10 0,18 Q-8,10 -8,0 Q-8,-10 0,-10" fill="#81d4fa" opacity="0.6" filter="url(#waterGlow)">
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Text "Drink Water" -->
  <text x="100" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#81d4fa" text-anchor="middle" opacity="0.9">Drink Water</text>
</svg>