<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1f3a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)" rx="20"/>

  <!-- Eye icon -->
  <g transform="translate(100, 100)">
    <!-- Eye outline -->
    <ellipse cx="0" cy="0" rx="55" ry="35" fill="none" stroke="#4fc3f7" stroke-width="3" filter="url(#glow)"/>

    <!-- Iris -->
    <circle cx="0" cy="0" r="22" fill="#0d47a1" filter="url(#glow)"/>

    <!-- Pupil -->
    <circle cx="0" cy="0" r="10" fill="#000"/>

    <!-- Highlight -->
    <ellipse cx="-6" cy="-8" rx="5" ry="3" fill="#fff" opacity="0.8"/>
    <ellipse cx="4" cy="4" rx="2" ry="1.5" fill="#fff" opacity="0.5"/>

    <!-- Eyelid animation -->
    <path d="M-55,0 Q0,-40 55,0" fill="none" stroke="#1e3a5f" stroke-width="4">
      <animate attributeName="d"
               values="M-55,0 Q0,-40 55,0; M-55,0 Q0,-5 55,0; M-55,0 Q0,-40 55,0"
               dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </path>

    <!-- Lower eyelid -->
    <path d="M-55,0 Q0,40 55,0" fill="none" stroke="#1e3a5f" stroke-width="4">
      <animate attributeName="d"
               values="M-55,0 Q0,40 55,0; M-55,0 Q0,5 55,0; M-55,0 Q0,40 55,0"
               dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </path>
  </g>

  <!-- Text "Look Away" -->
  <text x="100" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4fc3f7" text-anchor="middle" opacity="0.9">Look Away 20s</text>
</svg>